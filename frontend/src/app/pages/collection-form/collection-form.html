<div class="container form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Collection' : 'New Collection' }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="collectionForm" (ngSubmit)="onSubmit()" class="form-layout">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required placeholder="Enter collection name">
          <mat-error *ngIf="collectionForm.get('name')?.hasError('required')">
            Name is required.
          </mat-error>
          <mat-error *ngIf="collectionForm.get('name')?.hasError('maxlength')">
            Name must be at most 100 characters.
          </mat-error>
          <mat-error *ngIf="collectionForm.get('name')?.hasError('backend')">
            {{ collectionForm.get('name')?.getError('backend') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Optional description"></textarea>
          <mat-error *ngIf="collectionForm.get('description')?.hasError('maxlength')">
            Description must be at most 1000 characters.
          </mat-error>
        </mat-form-field>

        <p *ngIf="error" class="error-message" role="alert">{{ error }}</p>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/">Cancel</button>
          <button mat-flat-button color="primary" type="submit">
            {{ isEditMode ? 'Save Changes' : 'Create Collection' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
