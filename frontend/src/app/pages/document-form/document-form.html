<div class="container form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Document' : 'New Document' }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="documentForm" (ngSubmit)="onSubmit()" class="form-layout">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" required placeholder="Enter document title">
          <mat-error *ngIf="documentForm.get('title')?.hasError('required')">
            Title is required.
          </mat-error>
          <mat-error *ngIf="documentForm.get('title')?.hasError('maxlength')">
            Title must be at most 255 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="4" placeholder="Optional description"></textarea>
          <mat-error *ngIf="documentForm.get('description')?.hasError('maxlength')">
            Description must be at most 2000 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Collection</mat-label>
          <mat-select formControlName="collectionId" placeholder="Unassigned">
            <mat-option [value]="null">-- Unassigned --</mat-option>
            <mat-option *ngFor="let col of collections" [value]="col.id">
              {{ col.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <p *ngIf="error" class="error-message" role="alert">{{ error }}</p>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/">Cancel</button>
          <button mat-flat-button color="primary" type="submit">
            {{ isEditMode ? 'Save Changes' : 'Create Document' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
